name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format updated page in CI workspace
        run: bunx prettier --write src/routes/index.tsx
      - name: Lint updated application files
        run: bunx eslint src/routes/index.tsx src/routes/__root.tsx
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
