name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format changed platform files
        run: bunx prettier --write src/routes/index.tsx src/styles.css src/routes/__root.tsx README.md supabase/migrations/20261018194500_create_course_marketplace_schema.sql
      - name: Commit formatting when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routes/index.tsx src/styles.css src/routes/__root.tsx README.md supabase/migrations/20261018194500_create_course_marketplace_schema.sql
            git commit -m "style: format course platform implementation"
            git push
          fi
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
